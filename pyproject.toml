[project]
name = "logistics-control-tower"
version = "0.1.0"
description = "Pick-up order traceability: SLA-based critical orders, daily carrier alerts, SQL KPIs and a Power BI dashboard, on fictional data."
authors = [{ name = "Juan Tomas Camellini" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "numpy>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
